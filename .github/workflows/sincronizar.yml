name: Sincronizar datos
on:
  schedule: [{ cron: "*/5 * * * *" }]   # revisa cada 5 min; solo sincroniza si toca por la frecuencia del admin o si se forzó
  workflow_dispatch: {}                  # botón "Run workflow" para correrlo a mano
concurrency: { group: sincronizar, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node supabase/sincronizar.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_URL: ${{ secrets.GESTOR_URL }}
          GESTOR_TOKEN: ${{ secrets.GESTOR_TOKEN }}
