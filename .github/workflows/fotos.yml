name: Sincronizar fotos
on:
  schedule: [{ cron: "*/10 * * * *" }]   # revisa cada 10 min; solo trabaja si toca por la frecuencia del admin o si se forzó
  workflow_dispatch: {}
concurrency: { group: fotos, cancel-in-progress: false }
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node supabase/sincronizar-fotos.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          MAX_NUEVAS: "1500"
          TIEMPO_MAX_MIN: "30"
